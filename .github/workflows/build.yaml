name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Fix Dependencies
      run: |
        sed -i 's/realfft = { version = "3.5.0", features = \["avx", "sse"\] }/realfft = "3.5.0"/' src-tauri/Cargo.toml
        sed -i 's/^tauri-plugin-drag = "2.1.0"/# tauri-plugin-drag = "2.1.0"/' src-tauri/Cargo.toml
        sed -i 's/^tauri-plugin-opener = "2"/# tauri-plugin-opener = "2"/' src-tauri/Cargo.toml
        sed -i 's/^tauri-plugin-prevent-default = "2.0.0"/# tauri-plugin-prevent-default = "2.0.0"/' src-tauri/Cargo.toml

    # ==========================================
    # 注入 OOM 内存优化模块
    # ==========================================
    - name: Apply OOM Optimizations
      run: |
        cat << 'PYEOF' > patch.py
        import re

        # 1. 注入 mimalloc
        with open('src-tauri/Cargo.toml', 'r') as f: cargo = f.read()
        if 'mimalloc' not in cargo:
            cargo = cargo.replace('[dependencies]', '[dependencies]\nmimalloc = { version = "0.1", default-features = false }')
        with open('src-tauri/Cargo.toml', 'w') as f: f.write(cargo)

        with open('src-tauri/src/lib.rs', 'r') as f: c = f.read()
        if 'static GLOBAL: mimalloc::MiMalloc' not in c:
            c = c.replace('use anyhow::{bail, Context, Result};', '#[cfg(target_os = "android")]\n#[global_allocator]\nstatic GLOBAL: mimalloc::MiMalloc = mimalloc::MiMalloc;\n\nuse anyhow::{bail, Context, Result};')
        with open('src-tauri/src/lib.rs', 'w') as f: f.write(c)

        # 2. 渲染管道与 FFmpeg 优化
        with open('src-tauri/src/render.rs', 'r') as f: c = f.read()
        
        # 削减 PBO 队列，防显存爆炸
        c = c.replace('const N: usize = 5;', 'const N: usize = 2;')
        
        # 减少 FFmpeg 探测，释放内存
        c = c.replace('-probesize 50M', '-probesize 10M')
        
        # 开启硬件编码 (插在最前面)
        c = c.replace('pub const ENCODER_LIST_HEVC: [&str; 4] = ["hevc_nvenc", ', 'pub const ENCODER_LIST_HEVC: [&str; 5] = ["hevc_mediacodec", "hevc_nvenc", ')
        c = c.replace('pub const ENCODER_LIST_AVC: [&str; 4] = ["h264_nvenc", ', 'pub const ENCODER_LIST_AVC: [&str; 5] = ["h264_mediacodec", "h264_nvenc", ')

        with open('src-tauri/src/render.rs', 'w') as f: f.write(c)
        PYEOF

        python3 patch.py
        rm patch.py

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with: { node-version: 22 }
    - name: Install pnpm
      run: npm install -g pnpm@11
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with: { targets: aarch64-linux-android }
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with: { workspaces: "src-tauri -> target" }
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with: { distribution: 'temurin', java-version: '17' }

    - name: Setup Android SDK and NDK
      run: |
        SDKMANAGER_PATH=$(find /usr/local/lib/android/sdk -name sdkmanager | head -n 1)
        yes | $SDKMANAGER_PATH --licenses > /dev/null || true
        $SDKMANAGER_PATH "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
        echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "NDK_HOME=/usr/local/lib/android/sdk/ndk/27.0.12077973" >> $GITHUB_ENV
        echo "$(dirname $SDKMANAGER_PATH)" >> $GITHUB_PATH
        echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH

    - name: Set NDK Linker
      run: echo "RUSTFLAGS=-C linker=/usr/local/lib/android/sdk/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang" >> $GITHUB_ENV

    - name: Install Frontend Dependencies
      run: |
        rm -f pnpm-lock.yaml
        pnpm install --no-frozen-lockfile --config.strict-dep-builds=false
        
    - name: Init Android
      run: pnpm tauri android init --ci

    - name: Force Override Icon and Version
      run: |
        sed -i 's/versionName = .*/versionName = "1.6.5"/' src-tauri/gen/android/app/build.gradle.kts
        for dir in src-tauri/gen/android/app/src/main/res/mipmap-*; do
          if [ -d "$dir" ]; then
            cp -f src-tauri/icons/icon.png "$dir/ic_launcher.png" || true
            cp -f src-tauri/icons/icon.png "$dir/ic_launcher_round.png" || true
            cp -f src-tauri/icons/icon.png "$dir/ic_launcher_foreground.png" || true
          fi
        done

    - name: Patch Manifest
      run: |
        sed -i 's|<application|<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\n    <application|' src-tauri/gen/android/app/src/main/AndroidManifest.xml

    # ==========================================
    # 下载 FFmpeg 塞进 lib 目录 (Linker64 方案)
    # ==========================================
    - name: Download and Inject FFmpeg
      run: |
        wget -q https://github.com/hzw1199/Android-FFmpeg-Prebuilt/archive/refs/heads/main.zip -O ffmpeg.zip
        unzip -q ffmpeg.zip
        mkdir -p src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a
        cp Android-FFmpeg-Prebuilt-main/ffmpeg-9.0/bin/ffmpeg src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a/libffmpeg_bin.so
        cp Android-FFmpeg-Prebuilt-main/ffmpeg-9.0/libffmpeg.so src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a/libffmpeg.so

    - name: Build Android APK
      run: pnpm tauri android build --apk --target aarch64 -- --jobs 1
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: phi-recorder-apk
        path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk