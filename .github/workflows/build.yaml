name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with: { node-version: 22 }
      
    - name: Install pnpm
      run: npm install -g pnpm@11
      
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with: { targets: aarch64-linux-android }
      
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with: { workspaces: "src-tauri -> target" }
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with: { distribution: 'temurin', java-version: '17' }

    - name: Setup Android SDK and NDK
      run: |
        SDKMANAGER_PATH=$(find /usr/local/lib/android/sdk -name sdkmanager | head -n 1)
        yes | $SDKMANAGER_PATH --licenses > /dev/null || true
        $SDKMANAGER_PATH "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
        echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "NDK_HOME=/usr/local/lib/android/sdk/ndk/27.0.12077973" >> $GITHUB_ENV
        echo "$(dirname $SDKMANAGER_PATH)" >> $GITHUB_PATH
        echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH

    - name: Set NDK Linker
      run: echo "RUSTFLAGS=-C linker=/usr/local/lib/android/sdk/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang" >> $GITHUB_ENV

    - name: Install Frontend Dependencies
      run: |
        rm -f pnpm-lock.yaml
        pnpm install --no-frozen-lockfile --config.strict-dep-builds=false
        
    - name: Init Android
      run: pnpm tauri android init --ci

    - name: Force Override Icon and Version
      run: |
        sed -i 's/versionName = .*/versionName = "1.6.5"/' src-tauri/gen/android/app/build.gradle.kts
        for dir in src-tauri/gen/android/app/src/main/res/mipmap-*; do
          if [ -d "$dir" ]; then
            cp -f src-tauri/icons/icon.png "$dir/ic_launcher.png" || true
            cp -f src-tauri/icons/icon.png "$dir/ic_launcher_round.png" || true
            cp -f src-tauri/icons/icon.png "$dir/ic_launcher_foreground.png" || true
          fi
        done

    - name: Patch Manifest
      run: |
        MANIFEST="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
        sed -i 's|<application|<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <application|' $MANIFEST

- name: Download and Inject FFmpeg
  run: |
    # 直接下载整个源码包（云端内网极速下载）
    wget -q https://github.com/hzw1199/Android-FFmpeg-Prebuilt/archive/refs/heads/main.zip -O ffmpeg.zip
    unzip -q ffmpeg.zip
    
    # 创建目标目录
    mkdir -p src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a
    
    # 把文件复制过去（请确保云端的解压目录名和内部路径是对的）
    # 默认解压出来的文件夹叫 Android-FFmpeg-Prebuilt-main
    cp Android-FFmpeg-Prebuilt-main/ffmpeg-9.0/bin/ffmpeg src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a/libffmpeg_bin.so
    cp Android-FFmpeg-Prebuilt-main/ffmpeg-9.0/libffmpeg.so src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a/libffmpeg.so
    
    - name: Build Android APK
      run: pnpm tauri android build --apk --target aarch64 -- --jobs 1
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: phi-recorder-apk
        path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk